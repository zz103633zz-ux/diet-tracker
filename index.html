<title>吃多少 · 飲食紀錄</title>
<style>
:root{--bg:#131110;--card:#1d1a18;--card2:#272320;--line:rgba(255,255,255,.075);--tx:#f5f0ea;--tx2:#a8a097;--tx3:#6f6861;--ac:#f26b2a;--ac2:#ff9152;--acd:rgba(242,107,42,.15);--ok:#5fc48a;--bad:#ff5a4f;--r:22px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Heiti TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.glow{position:fixed;left:-30%;right:-30%;bottom:-38vh;height:72vh;background:radial-gradient(ellipse at center,rgba(242,107,42,.33),rgba(242,107,42,.09) 45%,transparent 70%);pointer-events:none;z-index:0}
.screen{display:none;min-height:100vh;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 32px);max-width:520px;margin:0 auto;position:relative;z-index:1}
.screen.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.022));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.small{font-size:12px}.xs{font-size:11px}
.ac{color:var(--ac2)}
.b{font-weight:700}.bb{font-weight:800}
.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ibtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid var(--line);flex:0 0 auto}
.ibtn:active{transform:scale(.94)}
.hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.hdr .date{font-size:17px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px;color:var(--tx2)}
.pill.acp{background:linear-gradient(180deg,#f8783a,#e35a1c);color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(242,107,42,.35)}
.pill .ico{width:15px;height:15px}
.hero{position:relative;margin:4px 0 6px}
.hero .big{font-size:64px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.hero .unit{font-size:18px;color:var(--tx2);margin-left:6px;font-weight:600}
.hero .shard{position:absolute;right:-16px;top:-34px;width:150px;height:140px;opacity:.95;pointer-events:none}
.acts{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px;margin:18px 0 22px;align-items:center}
.abtn{height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(180deg,#f57a3c,#e0581b);box-shadow:0 8px 24px rgba(242,107,42,.28),inset 0 1px 0 rgba(255,255,255,.25);white-space:nowrap;padding:0 8px}
.abtn .ico{width:18px;height:18px}
.abtn.ghost{background:linear-gradient(180deg,rgba(242,107,42,.22),rgba(242,107,42,.12));border:1.5px solid rgba(242,107,42,.75);box-shadow:none;font-size:14px}
.abtn.plus{width:64px;height:64px;padding:0}
.abtn.plus .ico{width:30px;height:30px;stroke-width:2.6}
.abtn:active{transform:scale(.96)}
.sech{display:flex;align-items:baseline;margin:6px 2px 8px}
.sech h3{font-size:15px;font-weight:700}
.sech .r{margin-left:auto;font-size:12.5px;color:var(--tx3)}
.today{display:flex;gap:16px;align-items:center}
.today .rem{font-size:40px;font-weight:800;line-height:1}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);margin-top:6px}
.kv b{color:var(--tx);font-weight:700}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.macro{padding:12px;border-radius:18px;margin:0}
.macro .l{font-size:12.5px;color:var(--tx2)}
.macro .v{font-size:15px;font-weight:800;color:var(--ac2);margin:3px 0 8px;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#e0581b,#ff9152);min-width:6px}
.bar i.over{background:var(--bad)}
.cups{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cup{width:22px;height:26px;color:rgba(255,255,255,.16)}
.cup.f{color:#5aa9ff}
.goalv{font-size:19px;font-weight:800;color:var(--ac2);margin-top:3px}
.note{font-size:14.5px;font-weight:600;line-height:1.5;margin:18px 2px 4px}
.dots{display:grid;grid-template-columns:repeat(16,1fr);gap:9px 0;justify-items:center;padding:4px 0}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-block}
.dot.l{background:#f2ece6}.dot.t{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--tx3);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.meal{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .nm{font-size:14.5px;font-weight:600;line-height:1.35}
.meal .sb{font-size:12px;color:var(--tx3);margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--acd);color:var(--ac2);font-weight:600;white-space:nowrap}
.foot{font-size:11.5px;color:var(--tx3);text-align:center;margin:18px 0 6px;line-height:1.6}
.banner{border-color:rgba(242,107,42,.5);background:linear-gradient(180deg,rgba(242,107,42,.18),rgba(242,107,42,.06))}
.ringw{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;flex:0 0 auto}
.ringw svg{display:block;overflow:visible}
.ringw .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringw .in b{font-weight:800}
.ringw .cap{font-size:12px;color:var(--tx2);margin-top:4px}
.ringrow{display:flex;justify-content:center;gap:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;position:relative;min-height:44px}
.top .ttl{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid var(--line);font-weight:800;font-size:15px;white-space:nowrap}
.top .ttl .ico{color:var(--ac);width:17px;height:17px}
h2.pt{font-size:22px;font-weight:800;margin:4px 2px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13.5px;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(40,30,25,.9);border:1px solid var(--line)}
.seg button{padding:9px 18px;border-radius:999px;font-size:14px;color:var(--tx2);font-weight:600;white-space:nowrap}
.seg button.on{background:#f3ece4;color:#1a1513}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(var(--sb) + 12px);display:flex;justify-content:center;z-index:20;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(19,17,16,.85) 40%)}
.bottombar>*{pointer-events:auto}
.search{position:relative;margin-bottom:10px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);width:18px;height:18px}
.search input{padding-left:38px;border-radius:14px}
.fl{padding:4px 14px}
.fi{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.fi:first-child{border-top:0}
.fi .nm{font-size:14.5px;font-weight:600}
.fi .sb{font-size:12px;color:var(--tx3);margin-top:2px}
.fi .pr{font-weight:800;font-size:14px;white-space:nowrap}
.addb{width:34px;height:34px;border-radius:50%;background:var(--acd);color:var(--ac2);display:flex;align-items:center;justify-content:center;border:1px solid rgba(242,107,42,.4);flex:0 0 auto;position:relative}
.addb .q{position:absolute;top:-6px;right:-6px;background:var(--ac);color:#fff;font-size:10.5px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tray{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);max-width:496px;margin:0 auto;z-index:25;border-radius:22px;background:rgba(30,26,24,.96);border:1px solid rgba(242,107,42,.5);padding:12px 14px;box-shadow:0 -8px 30px rgba(0,0,0,.5);display:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tray.on{display:block}
.tray.up{bottom:calc(var(--sb) + 76px)}
.btn{height:52px;border-radius:16px;width:100%;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#f57a3c,#e0581b);color:#fff;box-shadow:0 8px 22px rgba(242,107,42,.28)}
.btn.sec{background:rgba(255,255,255,.08);box-shadow:none;color:var(--tx)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 16px;flex:0 0 auto}
.btn.danger{background:rgba(255,90,79,.14);color:var(--bad);box-shadow:none}
.btn:active{transform:scale(.98)}
.combo{position:relative;overflow:hidden;cursor:pointer}
.combo:active{transform:scale(.985)}
.combo .st{font-weight:800;font-size:17px}
.combo .price{font-size:26px;font-weight:800;margin-left:auto}
.combo .its{margin:8px 0 10px;font-size:14px;line-height:1.6}
.combo .its div:before{content:"·";color:var(--ac2);margin-right:7px;font-weight:800}
.combo .stats{display:flex;gap:12px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.combo .stats b{color:var(--tx);font-size:15px;margin-right:2px}
.combo.best{border-color:rgba(242,107,42,.65);background:linear-gradient(135deg,rgba(242,107,42,.28),rgba(242,107,42,.06))}
.combo.best:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.fit{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.fit i{display:block;height:100%;background:var(--ac2)}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:12px;color:var(--tx2);margin:0 0 5px 2px;display:block}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mask.on{display:block;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;top:0;z-index:51;max-width:520px;margin:0 auto;background:#0f0d0c;border:1px solid rgba(242,107,42,.35);border-top:0;border-radius:0 0 30px 30px;padding:calc(var(--st) + 18px) 18px 18px;transform:translateY(-110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet.bot{top:auto;bottom:0;border-radius:30px 30px 0 0;border:1px solid rgba(255,255,255,.08);border-bottom:0;padding:18px 18px calc(var(--sb) + 18px);transform:translateY(110%)}
.sheet.bot.on{transform:none}
.pend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.pi{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 26px 10px 10px;font-size:13px}
.pi .k{font-size:11.5px;color:var(--tx3);margin-top:3px}
.pi .x{position:absolute;right:4px;top:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.pi .x .ico{width:14px;height:14px}

// gram-scalable foods: k100/p100/c100/f100 per 100 g, g0 = default serving grams, unit = serving label
function gramFood(o,g){const s=g/100;return Object.assign({},o,{g,kcal:Math.round(o.k100*s),p:Math.round(o.p100*s*10)/10,c:Math.round(o.c100*s*10)/10,f:Math.round(o.f100*s*10)/10})}

  return f=>{const h=hayOf(f);return toks.every(vs=>vs.some(v=>h.includes(v)))}}

function parseNum(v){if(typeof v==='number')return v;if(v==null)return NaN;let s=String(v).normalize('NFKC').replace(/[\s\u00a0]/g,'').replace(/[、，､]/g,',').replace(/[。．]/g,'.');

/* ---------- calculations ---------- */
function weightsSorted(){return S.weights.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function curWeight(){const w=weightsSorted();return w.length?num(w[w.length-1].kg,70):num(S.profile.weight,70)}
function bmr(){const p=S.profile;return 10*curWeight()+6.25*num(p.height,170)-5*num(p.age,30)+(p.sex==='f'?-161:5)}

function macroT(){const T=target();const P=Math.round(1.6*curWeight());const F=Math.round(T*0.28/9);const C=Math.max(0,Math.round((T-P*4-F*9)/4));return {kcal:T,p:P,c:C,f:F}}
function sumItems(items){const t={kcal:0,p:0,c:0,f:0,price:0};items.forEach(x=>{const q=x.q||1;t.kcal+=x.kcal*q;t.p+=x.p*q;t.c+=x.c*q;t.f+=x.f*q;t.price+=x.price*q});return t}

  while(set.has(d)){cur++;d=addDays(d,-1)}

  const past=ds.filter(x=>x<today);const last=past.length?past[past.length-1]:null;

  return `<div class="ringw"><div style="position:relative;width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${sw}"/>${arc}</svg><div class="in">${inner}</div></div>${cap?`<div class="cap">${cap}</div>`:''}</div>`;
}

/* ---------- RECOMMEND (rule-based) ---------- */
let recTab='ai';
const rec={mode:'multi',store:'全部',budget:'',kcal:null,combos:[]};
function defMealKcal(){const rem=target()-dayTot(dk()).kcal;const d=new Date(),t=d.getHours()*60+d.getMinutes();const left=t<630?3:t<840?2.4:t<1080?1.6:1;
  return Math.max(250,Math.min(1200,Math.round(Math.max(rem,300)/left/50)*50))}
function genCombos(){
  const kT=Math.max(150,num(rec.kcal,defMealKcal())),bud=num(rec.budget,0);
  const T=macroT(),E=dayTot(dk());const remK=Math.max(T.kcal-E.kcal,kT),remP=Math.max(T.p-E.p,0);
  const pT=Math.max(15,Math.min(60,Math.round(remP*kT/remK)));
  const pool=priceFoods().filter(f=>(rec.store==='全部'||f.store===rec.store)&&(!bud||f.price<=bud)&&f.kcal<=kT*1.15);
  const by={};pool.forEach(f=>(by[f.store]=by[f.store]||[]).push(f));const sts=Object.keys(by);
  const res=new Map();
  if(sts.length)for(let i=0;i<1500;i++){
    const st=rnd(sts),list=by[st];let items;
    if(rec.mode==='single'){const mains=list.filter(f=>f.cat==='main'||f.kcal>=250);if(!mains.length)continue;items=[rnd(mains)]}
    else{const bases=list.filter(f=>f.cat==='main'||f.cat==='protein');if(!bases.length)continue;items=[rnd(bases)];const n=Math.random()<.55?2:3;let g=0;
      while(items.length<n&&g++<14){const x=rnd(list);if(items.includes(x))continue;if(x.cat==='drink'&&items.some(y=>y.cat==='drink'))continue;if(x.cat==='main'&&items.some(y=>y.cat==='main'))continue;if(items.some(y=>y.name===x.name))continue;items.push(x)}
      if(items.length<2)continue}
    const t=sumItems(items);if(t.kcal>kT*1.1||t.kcal<kT*0.35)continue;if(bud&&t.price>bud)continue;
    const key=st+'|'+items.map(x=>x.id).sort().join(',');if(res.has(key))continue;
    const fit=Math.abs(t.kcal-kT*0.95)/kT,pp=Math.max(0,pT-t.p)/pT;
    res.set(key,{store:st,items,t,score:fit+pp*0.9+Math.random()*0.3});
  }
  const all=[...res.values()].sort((a,b)=>a.score-b.score);const out=[],cnt={};
  for(const c of all){if(rec.store==='全部'&&(cnt[c.store]||0)>=1)continue;cnt[c.store]=1;out.push(c);if(out.length>=5)break}
  if(out.length<5)for(const c of all){if(!out.includes(c)){out.push(c);if(out.length>=5)break}}
  rec.combos=out;rec.pT=pT;rec.kT=kT;
}

function renderCombos(){
  const el=$('#combos');const T=macroT(),E=dayTot(dk());
  const head=`<div class="mut small" style="margin:0 2px 10px;line-height:1.5">今天還剩 <b class="ac num">${fmt(T.kcal-E.kcal)}</b> kcal · 這餐目標 ${fmt(rec.kT)} kcal、蛋白質約 ${rec.pT} g</div>`;

function logMeal(items){
  const now=new Date(),today=dk(now);const before=streakInfo();const nToday=dayMeals(today).length;
  const clean=items.map(x=>({name:String(x.name),store:x.store||'',kcal:num(x.kcal),p:num(x.p),c:num(x.c),f:num(x.f),price:num(x.price),q:num(x.q,1)}));
  const t=sumItems(clean);
  S.meals.push({id:uid(),date:today,time:pad(now.getHours())+':'+pad(now.getMinutes()),label:mealLabel(now.getHours(),now.getMinutes()),items:clean,kcal:Math.round(t.kcal),p:r1(t.p),c:r1(t.c),f:r1(t.f),price:Math.round(t.price)});
  save();
  let msg;
  if(!before.ds.length)msg='第一筆紀錄完成！Combo 從今天開始算。';
  else if(before.loggedToday)msg=`今天第 ${nToday+1} 餐，記得很勤快。`;
  else if(before.gap===1)msg=`連續記錄接上了，Combo 變成 ${before.cur+1} 天。`;
  else msg=`上一次記是 ${before.gap} 天前。中間停一段是常有的事，今天記一筆就接上。`;
  go('done',msg);
}
R.done=function(msg){

  let seg='';for(let i=13;i>=0;i--){const k=addDays(today,-i);seg+=`<i class="${k===today?'t':st.set.has(k)?'l':''}"></i>`}

  $('#s-done').innerHTML=`<div class="okc"><div class="h"><span class="ck">${I.check}</span>已更新</div><p><span class="ac">${I.fork}</span> ${esc(msg||'')}</p></div>
  <div class="card" style="text-align:center;padding-top:22px">
   ${ring(E.kcal,T.kcal,150,13,`<b class="num" style="font-size:36px">${fmt(E.kcal)}</b><span class="xs mut num">大卡 / ${fmt(T.kcal)}</span>`,'熱量')}
   <div class="ringrow" style="margin-top:14px">${ring(E.p,T.p,74,7,`<b class="num" style="font-size:13px">${Math.round(E.p)}g</b>`,'蛋白質')}${ring(E.c,T.c,74,7,`<b class="num" style="font-size:13px">${Math.round(E.c)}g</b>`,'碳水')}${ring(E.f,T.f,74,7,`<b class="num" style="font-size:13px">${Math.round(E.f)}g</b>`,'脂肪')}</div>
   <div class="hr" style="margin-top:18px"></div><div class="row"><span class="mut small">今日累積消費</span><div class="sp"></div><b class="num" style="font-size:20px">$${fmt(E.price)}</b></div></div>

   <div class="row num" style="justify-content:space-around;margin:12px 0 4px;font-size:13px;text-align:center"><div><b style="font-size:18px">${fmt(dt.kcal)}</b><div class="mut xs">kcal</div></div><div><b style="font-size:18px">${Math.round(dt.p)}</b><div class="mut xs">蛋白 g</div></div><div><b style="font-size:18px">${Math.round(dt.c)}</b><div class="mut xs">碳水 g</div></div><div><b style="font-size:18px">${Math.round(dt.f)}</b><div class="mut xs">脂肪 g</div></div><div><b style="font-size:18px">$${fmt(dt.price)}</b><div class="mut xs">消費</div></div></div>
   <div class="tiny" style="text-align:center">喝水 ${num(S.water[histDay],0)} 杯</div><div class="hr"></div>
   <div>${dm.length?dm.map(mealRow).join(''):'<div class="empty">這天沒有紀錄</div>'}</div></div>
  <div class="card" id="wcard"><div class="row"><b>體重</b><div class="sp"></div><span class="small mut num">目前 ${curWeight().toFixed(1)} kg · 目標 ${num(S.profile.goal).toFixed(1)} kg</span></div>
   <div class="row" style="margin:12px 0"><input type="date" id="w-d" value="${today}" max="${today}" style="flex:1.3;min-width:0"><input type="text" inputmode="decimal" autocomplete="off" step="0.1" id="w-k" placeholder="kg" style="flex:1;min-width:0"><button class="btn sm" id="w-add">記錄</button></div>
   ${wchart}<div style="margin-top:6px">${wlist}</div></div>
  <div class="foot">營養數值為估算</div>`;
  const root=$('#s-hist');
  root.querySelectorAll('[data-hd]').forEach(r=>r.addEventListener('click',()=>{histDay=r.getAttribute('data-hd');R.hist()}));
  $('#hd-p').onclick=()=>{histDay=addDays(histDay,-1);R.hist()};
  $('#hd-n').onclick=()=>{if(histDay<today){histDay=addDays(histDay,1);R.hist()}};
  $('#w-add').onclick=()=>{const kg=num($('#w-k').value);const d=$('#w-d').value||today;if(!(kg>20&&kg<400)){toast('請輸入合理的體重');return}
    S.weights=S.weights.filter(w=>w.date!==d);S.weights.push({date:d,kg:r1(kg)});save();toast('已記錄體重 '+r1(kg).toFixed(1)+' kg');R.hist()};
  root.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{if(!confirm('刪除這筆體重？'))return;S.weights=S.weights.filter(w=>w.date!==b.dataset.wdel);save();R.hist()});
  bindMealDel(root,R.hist);
};

/* ---------- SETTINGS ---------- */
const ACT=[[1.2,'久坐（幾乎不運動）'],[1.375,'輕度（每週運動 1–3 天）'],[1.55,'中度（每週運動 3–5 天）'],[1.725,'高度（每週運動 6–7 天）'],[1.9,'非常高（體力工作＋訓練）']];
const DEF=[[0,'維持體重（不調整）'],[250,'溫和減脂（每天 -250）'],[500,'標準減脂（每天 -500）'],[750,'積極減脂（每天 -750）'],[-300,'增肌增重（每天 +300）']];
R.set=function(){
  const p=S.profile;
  $('#s-set').innerHTML=topbar()+`<h2 class="pt">設定</h2>
  <div class="card"><b>身體資料</b><div class="form" style="margin-top:12px">
   <div class="full"><span class="lbl">性別</span><div class="sw" id="sx"><button data-v="m" class="${p.sex!=='f'?'on':''}">男</button><button data-v="f" class="${p.sex==='f'?'on':''}">女</button></div></div>
   <label><span class="lbl">年齡</span><input id="p-age" type="text" inputmode="numeric" autocomplete="off" value="${esc(p.age)}"></label>
   <label><span class="lbl">身高 cm</span><input id="p-h" type="text" inputmode="decimal" autocomplete="off" value="${esc(p.height)}"></label>
   <label><span class="lbl">目前體重 kg</span><input id="p-w" type="text" inputmode="decimal" autocomplete="off" step="0.1" value="${esc(r1(curWeight()))}"></label>
   <label><span class="lbl">目標體重 kg</span><input id="p-g" type="text" inputmode="decimal" autocomplete="off" step="0.1" value="${esc(p.goal)}"></label>
   <label class="full"><span class="lbl">活動量</span><select id="p-a">${ACT.map(a=>`<option value="${a[0]}" ${num(p.activity)===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></label>
   <label class="full"><span class="lbl">每日熱量調整</span><select id="p-d">${DEF.map(a=>`<option value="${a[0]}" ${num(p.deficit)===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></label>
   <label><span class="lbl">每日喝水目標（杯）</span><input id="p-wg" type="text" inputmode="numeric" autocomplete="off" value="${esc(p.waterGoal)}"></label>
  </div><div class="calc" id="calc" style="margin-top:14px"></div><div id="cwarn"></div>
  <button class="btn" id="p-save" style="margin-top:14px">${I.check}儲存</button></div>
  <div class="card" id="ucard"><div class="row"><b>使用者</b><div class="sp"></div><span class="tiny">每個人的資料分開存</span></div>
   <div style="margin-top:8px">${U.list.map(u=>`<div class="urow${u.id===U.cur?' cur':''}">${avatar(u.name)}<div class="sp" style="min-width:0"><div class="nm">${esc(u.name)}</div><div class="xs mut3">${u.id===U.cur?'目前使用中':'點「切換」改用這位'}</div></div>${u.id===U.cur?'':`<button class="btn sec sm" data-usw="${esc(u.id)}">切換</button>`}<button class="ibtn" data-uren="${esc(u.id)}" aria-label="改名" style="width:36px;height:36px">${I.edit}</button><button class="ibtn" data-udel="${esc(u.id)}" aria-label="刪除使用者" style="width:36px;height:36px;color:var(--tx3)">${I.trash}</button></div>`).join('')}</div>
   <button class="btn sec" id="u-add" style="height:46px;margin-top:10px">${I.plus}新增使用者</button></div>
  <div class="card"><b>備份</b><div class="mut small" style="margin:6px 0 12px;line-height:1.5">資料只存在這支 iPhone 的瀏覽器裡。匯出／匯入的是目前使用者「${esc(curUser().name)}」的資料。清除 Safari 資料或換手機前，請先匯出備份。</div>
   <div class="row"><button class="btn sec" id="ex" style="height:46px">${I.down}匯出 JSON</button><button class="btn sec" id="im" style="height:46px">${I.up}匯入 JSON</button></div>
   <input type="file" id="imf" accept="application/json,.json,text/plain" style="display:none">
   <div id="exbox"></div>
   <details style="margin-top:12px"><summary class="small mut">或貼上 JSON 文字匯入</summary><textarea id="imt" placeholder='{"v":1, ...}' style="margin-top:8px"></textarea><button class="btn sec sm" id="imt-ok" style="margin-top:8px">從文字匯入</button></details></div>
  <div class="card" id="mycard"><div class="row"><b>我的食物</b><div class="sp"></div><span class="tiny">${S.custom.length} 項 · 只屬於「${esc(curUser().name)}」</span></div><button class="btn sec" id="c-add" style="height:46px;margin-top:10px">${I.plus}新增到我的食物（不記錄）</button><div style="margin-top:6px" id="mylist">${S.custom.length?S.custom.map(c=>`<div class="meal"><div class="sp"><div class="nm">${esc(c.name)}</div><div class="sb num">${num(c.kcal)} kcal · P${num(c.p)} C${num(c.c)} F${num(c.f)} · $${num(c.price)}${c.shop?' · '+esc(c.shop):''}</div></div><button class="ibtn" data-cdel="${esc(c.id)}" aria-label="刪除" style="width:34px;height:34px;color:var(--tx3)">${I.trash}</button></div>`).join(''):'<div class="empty">按上面的按鈕新增，或用首頁「+」時勾選「存到我的」</div>'}</div></div>
  <div class="card"><button class="btn danger" id="reset">清除「${esc(curUser().name)}」的所有資料</button></div>
  <div class="foot">TDEE = Mifflin-St Jeor 基礎代謝 × 活動係數<br>蛋白質 1.6 g/kg、脂肪 28%、其餘為碳水<br>營養數值為估算，非醫療建議<br>食材資料庫／配料：衛生福利部食品藥物管理署「食品營養成分資料庫」（政府資料開放平臺，2026-10 版）；薯餅、炸雞腿排：USDA FoodData Central（SR Legacy）</div>`;
  let sex=p.sex==='f'?'f':'m';
  const read=()=>({sex,age:num($('#p-age').value,30),height:num($('#p-h').value,170),weight:num($('#p-w').value,70),goal:num($('#p-g').value,65),activity:num($('#p-a').value,1.375),deficit:num($('#p-d').value,0),waterGoal:Math.max(1,Math.min(30,Math.round(num($('#p-wg').value,8))))});
  const calc=()=>{const q=read();const b=10*q.weight+6.25*q.height-5*q.age+(q.sex==='f'?-161:5);const t=Math.round(b*q.activity);const fl=q.sex==='f'?1200:1500;const raw=t-q.deficit;const tg=Math.round(Math.max(raw,Math.min(fl,t)));
    const P=Math.round(1.6*q.weight),F=Math.round(tg*.28/9),C=Math.max(0,Math.round((tg-P*4-F*9)/4));
    $('#calc').innerHTML=`<div><span class="xs mut">基礎代謝 BMR</span><b class="num">${fmt(b)}</b></div><div><span class="xs mut">每日消耗 TDEE</span><b class="num">${fmt(t)}</b></div><div><span class="xs mut">每日目標</span><b class="num ac">${fmt(tg)}</b></div><div><span class="xs mut">蛋白 / 碳水 / 脂肪</span><b class="num" style="font-size:16px;margin-top:5px">${P} / ${C} / ${F} g</b></div>`;
    $('#cwarn').innerHTML=raw<fl&&q.deficit>0?`<div class="warn">目標已提高到安全下限 ${fl} kcal（不建議長期低於此熱量）。</div>`:''};
  $('#s-set').querySelectorAll('#sx button').forEach(b=>b.onclick=()=>{sex=b.dataset.v;$('#s-set').querySelectorAll('#sx button').forEach(x=>x.classList.toggle('on',x===b));calc()});
  ['p-age','p-h','p-w','p-g','p-a','p-d','p-wg'].forEach(id=>{$('#'+id).oninput=calc;$('#'+id).onchange=calc});calc();
  $('#p-save').onclick=()=>{const q=read();if(q.age<10||q.age>110||q.height<100||q.height>250||q.weight<25||q.weight>350||q.goal<25||q.goal>350){toast('請確認年齡、身高、體重');return}
    const oldW=r1(curWeight());Object.assign(S.profile,q,{setup:true});
    if(r1(q.weight)!==oldW&&S.weights.length){const d=dk();S.weights=S.weights.filter(w=>w.date!==d);S.weights.push({date:d,kg:r1(q.weight)})}
    rec.kcal=null;save();toast('已儲存');go('home')};
  $('#ex').onclick=()=>{const txt=JSON.stringify(Object.assign({},S,{user:curUser().name}));const nm=curUser().name.replace(/[\\/:*?"<>|\s]+/g,'_');const name='diet-backup-'+(nm?nm+'-':'')+dk().replace(/-/g,'')+'.json';
    try{const blob=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}catch(e){}
    $('#exbox').innerHTML=`<div class="tiny" style="margin-top:12px;line-height:1.5">若沒有跳出下載（例如從主畫面開啟時），可長按下方文字全選複製，貼到備忘錄保存：</div><textarea readonly style="margin-top:6px">${esc(txt)}</textarea>`;toast('已匯出 '+name)};
  const doImport=txt=>{let j;try{j=JSON.parse(txt)}catch(e){toast('JSON 格式錯誤');return}if(!j||!j.profile||!Array.isArray(j.meals)){toast('這不是本 App 的備份檔');return}
    if(!confirm(`匯入會覆蓋「${curUser().name}」目前的資料（${j.meals.length} 筆餐點、${(j.weights||[]).length} 筆體重${j.user&&j.user!==curUser().name?'，備份來自「'+j.user+'」':''}），確定？`))return;S=normalize(j);save();toast('匯入完成');go('home')};
  $('#im').onclick=()=>$('#imf').click();
  $('#imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f);e.target.value=''};
  $('#imt-ok').onclick=()=>doImport($('#imt').value);
  $('#c-add').onclick=()=>openFoodForm('custom');
  $('#s-set').querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{const c=S.custom.find(x=>x.id===b.dataset.cdel);if(!c||!confirm('從我的食物刪除「'+c.name+'」？'))return;S.custom=S.custom.filter(x=>x.id!==c.id);save();R.set();toast('已刪除')});
  $('#s-set').querySelectorAll('[data-usw]').forEach(b=>b.onclick=()=>{switchUser(b.dataset.usw);toast('已切換到「'+curUser().name+'」')});
  $('#s-set').querySelectorAll('[data-uren]').forEach(b=>b.onclick=()=>renameSheet(b.dataset.uren));
  $('#s-set').querySelectorAll('[data-udel]').forEach(b=>b.onclick=()=>deleteUser(b.dataset.udel));
  $('#u-add').onclick=()=>go('user',{add:true});
  $('#reset').onclick=()=>{if(!confirm(`確定清除「${curUser().name}」的所有紀錄與設定？其他使用者不受影響。此動作無法復原（建議先匯出備份）`))return;S=defState();save();tray=[];toast('已清除');go('home')};
};

/* ---------- USER (who are you / add user) ---------- */
R.user=function(arg){arg=arg||{};const first=!U.list.length,mig=first&&hasLegacy();
  $('#s-user').innerHTML=(curUser()?topbar():'')+`<div class="${curUser()?'':'uwrap'}">
  <div class="pill">${I.user}${first?'歡迎':'新增使用者'}</div>
  <h1 style="margin-top:12px">你是誰？<br>輸入名字或暱稱</h1>
  <div class="mut small" style="margin:0 2px 16px;line-height:1.6">${mig?'偵測到這台裝置上已經有之前的紀錄。輸入名字後，原本的資料會全部移到這位使用者，不會遺失。':'每個人的紀錄、體重、喝水、我的食物都分開存，只存在這台裝置的瀏覽器裡。'}</div>
  <div class="card"><label><span class="lbl">名字或暱稱</span><input id="u-name" maxlength="20" autocomplete="nickname" placeholder="例如：小明"></label>
  <button class="btn" id="u-ok" style="margin-top:14px">${I.check}${mig?'開始使用（保留原本資料）':'開始使用'}</button></div>
  ${U.list.length?`<div class="sech"><h3>或切換到</h3></div><div class="card">${U.list.map(u=>`<div class="urow" data-upick="${esc(u.id)}" style="cursor:pointer">${avatar(u.name)}<div class="sp nm">${esc(u.name)}</div>${I.next}</div>`).join('')}</div>`:''}
  </div>`;
  const ok=()=>{if(addUser($('#u-name').value))go('home')};
  $('#u-ok').onclick=ok;$('#u-name').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
  $('#s-user').querySelectorAll('[data-upick]').forEach(r=>r.onclick=()=>switchUser(r.dataset.upick));
};
function userSheet(){const c=curUser();
  openSheet(`<div class="row" style="margin-bottom:8px"><b style="font-size:18px">切換使用者</b><div class="sp"></div><button class="ibtn" id="us-x" style="width:36px;height:36px" aria-label="關閉">${I.x}</button></div>
  <div>${U.list.map(u=>`<div class="urow${u.id===U.cur?' cur':''}" data-usw="${esc(u.id)}" style="cursor:pointer">${avatar(u.name)}<div class="sp" style="min-width:0"><div class="nm">${esc(u.name)}</div><div class="xs mut3">${u.id===U.cur?'目前使用中':'點一下切換'}</div></div>${u.id===U.cur?I.check:I.next}</div>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn sec" id="us-add" style="height:46px">${I.plus}新增使用者</button><button class="btn sec" id="us-ren" style="height:46px">${I.edit}改名</button></div>`,false);
  $('#us-x').onclick=closeSheet;
  $('#sheet').querySelectorAll('[data-usw]').forEach(r=>r.onclick=()=>{if(r.dataset.usw===U.cur){closeSheet();return}switchUser(r.dataset.usw);toast('已切換到「'+curUser().name+'」')});
  $('#us-add').onclick=()=>go('user',{add:true});
  $('#us-ren').onclick=()=>renameSheet(c.id);
}
function renameSheet(id){const u=U.list.find(x=>x.id===id);if(!u)return;
  openSheet(`<div class="row" style="margin-bottom:12px"><b style="font-size:18px">改名</b><div class="sp"></div><button class="ibtn" id="rn-x" style="width:36px;height:36px" aria-label="關閉">${I.x}</button></div>
  <label><span class="lbl">名字或暱稱</span><input id="rn-v" maxlength="20" value="${esc(u.name)}"></label>
  <button class="btn" id="rn-ok" style="margin-top:14px">${I.check}儲存</button>`,false);
  $('#rn-x').onclick=closeSheet;
  const ok=()=>{if(renameUser(id,$('#rn-v').value)){toast('已改名為「'+U.list.find(x=>x.id===id).name+'」');closeSheet();R[cur]()}};
  $('#rn-ok').onclick=ok;$('#rn-v').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
}

/* ---------- boot ---------- */
document.body.insertAdjacentHTML('afterbegin','<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa067"/><stop offset="1" stop-color="#e5561a"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9152"/><stop offset="1" stop-color="#d9531a"/></linearGradient></defs></svg>');
$('#mask').onclick=()=>{const s=$('#sheet');if(s.dataset.form&&[...s.querySelectorAll('input[type=text]')].some(i=>i.value.trim())){const b=$('#q-err');if(b){b.textContent='要放棄這筆嗎？按右上角 × 關閉，或按下方按鈕儲存';b.classList.add('on')}return}closeSheet()};
let lastDay=dk();
document.addEventListener('visibilitychange',()=>{if(document.hidden||cur==='user')return;if($('#sheet').classList.contains('on')){fitSheet();return}if(cur==='home'||dk()!==lastDay){lastDay=dk();go('home')}});
go('home');
</script>
